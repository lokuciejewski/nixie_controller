[package]
name = "controller-module"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.8.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.4.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }

heapless = "0.8.0"

embassy-stm32 = { version = "0.3.0", features = [
    "defmt",
    "memory-x",
    "time-driver-any",
] }
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"

defmt = "0.3"
defmt-rtt = "0.4.2"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-hal = { version = "1.0.0", features = ["defmt-03"] }
embassy-sync = { version = "0.7.1", features = ["defmt"] }
embedded-resources = { version = "0.2.1", features = ["stm32"] }

[features]
default = ["sample_1"]
evalboard = ["embassy-stm32/stm32u031r8"]
sample_1 = ["embassy-stm32/stm32u031c8"]


[profile.dev]
opt-level = 1
lto = "fat"
incremental = false
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
codegen-units = 1
debug = true
